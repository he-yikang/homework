    <circle cx="1160" cy="240" r="11" fill="#22d3ee" fill-opacity="0.10"/><circle cx="1160" cy="240" r="5" fill="#22d3ee" fill-opacity="0.6"/>
  </g>

  <!-- 文字 -->
  <text x="72" y="150" font-size="62" font-weight="800" fill="url(#ttl)">人工智能概论</text>
  <text x="74" y="190" font-size="16" letter-spacing="3" fill="#22d3ee">AI INTRODUCTION · COURSE PORTFOLIO</text>
  <text x="74" y="232" font-size="22" fill="#e8e8f0">课程作业集 — AI 编程实践 × 深度学习可视化</text>

  <g font-size="15" font-weight="600">
    <rect x="74" y="262" width="96" height="34" rx="17" fill="#a855f7" fill-opacity="0.18" stroke="#a855f7" stroke-opacity="0.5"/>
    <text x="122" y="284" fill="#e9d5ff" text-anchor="middle">作业 1</text>
    <rect x="184" y="262" width="96" height="34" rx="17" fill="#3b82f6" fill-opacity="0.18" stroke="#3b82f6" stroke-opacity="0.5"/>
    <text x="232" y="284" fill="#bfdbfe" text-anchor="middle">作业 2</text>
    <rect x="294" y="262" width="150" height="34" rx="17" fill="#22c55e" fill-opacity="0.16" stroke="#22c55e" stroke-opacity="0.5"/>
    <text x="369" y="284" fill="#bbf7d0" text-anchor="middle">GitHub Pages</text>
