<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" font-family="'PingFang SC','Microsoft YaHei','Noto Sans SC',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0a0f"/>
      <stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <radialGradient id="gP" cx="16%" cy="26%" r="58%">
      <stop offset="0" stop-color="#a855f7" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#a855f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gB" cx="90%" cy="84%" r="58%">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ttl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#gP)"/>
  <rect width="1280" height="360" fill="url(#gB)"/>

  <!-- 神经网络剪影（输入 2 -> 隐藏 -> 输出 3） -->
  <g stroke="#8b5cf6" stroke-opacity="0.16" stroke-width="1">
    <line x1="800" y1="120" x2="920" y2="90"/>
    <line x1="800" y1="120" x2="920" y2="180"/>
    <line x1="800" y1="120" x2="920" y2="270"/>
    <line x1="800" y1="240" x2="920" y2="90"/>
    <line x1="800" y1="240" x2="920" y2="180"/>
    <line x1="800" y1="240" x2="920" y2="270"/>
    <line x1="920" y1="90" x2="1040" y2="90"/>
    <line x1="920" y1="90" x2="1040" y2="180"/>
    <line x1="920" y1="90" x2="1040" y2="270"/>
    <line x1="920" y1="180" x2="1040" y2="90"/>
    <line x1="920" y1="180" x2="1040" y2="180"/>
    <line x1="920" y1="180" x2="1040" y2="270"/>
    <line x1="920" y1="270" x2="1040" y2="90"/>
    <line x1="920" y1="270" x2="1040" y2="180"/>
    <line x1="920" y1="270" x2="1040" y2="270"/>
    <line x1="1040" y1="90" x2="1160" y2="150"/>
    <line x1="1040" y1="90" x2="1160" y2="240"/>
    <line x1="1040" y1="180" x2="1160" y2="150"/>
    <line x1="1040" y1="180" x2="1160" y2="240"/>
    <line x1="1040" y1="270" x2="1160" y2="150"/>
    <line x1="1040" y1="270" x2="1160" y2="240"/>
  </g>
  <g>
    <circle cx="800" cy="120" r="11" fill="#a855f7" fill-opacity="0.10"/><circle cx="800" cy="120" r="5" fill="#a855f7" fill-opacity="0.55"/>
    <circle cx="800" cy="240" r="11" fill="#a855f7" fill-opacity="0.10"/><circle cx="800" cy="240" r="5" fill="#a855f7" fill-opacity="0.55"/>
    <circle cx="920" cy="90" r="11" fill="#8b5cf6" fill-opacity="0.10"/><circle cx="920" cy="90" r="5" fill="#8b5cf6" fill-opacity="0.55"/>
    <circle cx="920" cy="180" r="11" fill="#8b5cf6" fill-opacity="0.10"/><circle cx="920" cy="180" r="5" fill="#8b5cf6" fill-opacity="0.55"/>
    <circle cx="920" cy="270" r="11" fill="#8b5cf6" fill-opacity="0.10"/><circle cx="920" cy="270" r="5" fill="#8b5cf6" fill-opacity="0.55"/>
    <circle cx="1040" cy="90" r="11" fill="#3b82f6" fill-opacity="0.10"/><circle cx="1040" cy="90" r="5" fill="#3b82f6" fill-opacity="0.55"/>
    <circle cx="1040" cy="180" r="11" fill="#3b82f6" fill-opacity="0.10"/><circle cx="1040" cy="180" r="5" fill="#3b82f6" fill-opacity="0.55"/>
